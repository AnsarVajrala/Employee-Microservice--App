spring.application.name=Employee-Service
server.port=8081
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=sql

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.projectService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.projectService.sliding-window-size=5
resilience4j.circuitbreaker.instances.projectService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.projectService.wait-duration-in-open-state=10s